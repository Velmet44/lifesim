[workspace]
members = [
  "crates/earth-core",
  "crates/earth-kernels",
  "crates/formation",
  "crates/solar",
  "crates/interior",
  "crates/tectonics",
  "crates/atmos",
  "crates/ocean",
  "crates/ice",
  "crates/geochem",
  "crates/bio",
  "crates/eco",
  "crates/civs",
  "crates/earth-io",
  "crates/earth-cli",
  "crates/earth-gpui",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
pollster = "0.3"
wgpu = "22"
