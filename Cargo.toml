[workspace]
members = [
  "crates/earth-core",
  "crates/earth-kernels",
  "crates/formation",
  "crates/solar",
  "crates/interior",
  "crates/tectonics",
  "crates/atmos",
  "crates/ocean",
  "crates/ice",
  "crates/geochem",
  "crates/bio",
  "crates/eco",
  "crates/civs",
  "crates/earth-io",
  "crates/earth-cli",
  "crates/earth-gpui",
]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
